name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    commits:
        name: Commits
        uses: NixySoftware/.github/.github/workflows/commits.yml@e4cce7beed9cf44052c57e416e15cc25f6617eb8

    rust:
        name: Rust
        uses: NixySoftware/.github/.github/workflows/rust.yml@e4cce7beed9cf44052c57e416e15cc25f6617eb8

    typescript:
        name: TypeScript
        uses: NixySoftware/.github/.github/workflows/typescript.yml@e4cce7beed9cf44052c57e416e15cc25f6617eb8

    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 'lts/*'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run make
              working-directory: packages/supermarket-authenticator
